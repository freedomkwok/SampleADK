[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-agent"
version = "0.1.0"
description = "Standalone ADK + A2A agent with Graphiti (Oracle PG) graph retrieval"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.27.1",
    "a2a-sdk>=0.3.4,<1.0",
    "google-cloud-aiplatform[agent_engines,adk]>=1.112.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "langfuse>=4.0.0",
    "starlette>=0.34.0",
    "graphiti-core[oracle]",
    "openai>=1.50.0",
    "litellm>=1.75.5",
]

[tool.hatch.build.targets.wheel]
packages = ["sample_agent"]

# Editable Graphiti checkout — path depth must match your checkout layout, for example:
#   graphiti-core = { path = "../../graphiti", editable = true }
# when the Python project lives two levels below the repo root that contains `graphiti/`.
[tool.uv.sources]
graphiti-core = { path = "../graphiti", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
